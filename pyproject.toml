[project]
name = "ecotwin-ai"
version = "1.0.0"
description = "AI Building & Power Operations Platform — portfolio prototype"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the documented pattern
    "SIM108",  # a ternary is not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# B019 warns that lru_cache on a method keeps `self` alive. Here the services
# are process-wide singletons behind their own lru_cache, so the reference is
# to an object that lives for the process anyway, and every cache is bounded.
# Moving the caches out would mean hand-rolling the same keying by asset and
# scenario, with the same lifetime, for no benefit.
"apps/api/services/bms.py" = ["B019"]
"apps/api/services/ems.py" = ["B019"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/(\\.venv|apps/web)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:.*numba.*:UserWarning",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv", "apps/web"]
