# fly.toml app configuration file generated for bmsems-demo on 2026-09-20T01:04:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bmsems-demo'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ECOTWIN_LOG_LEVEL = 'INFO'
  PORT = '8000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
